name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Remove broken android folder
        run: rm -rf android

      - name: Recreate Android project
        run: flutter create --platforms=android .

      - name: Force SDK 34 in build.gradle.kts
        run: |
          # Ищем файл конфигурации (проверяем оба варианта: .gradle и .gradle.kts)
          FILE="android/app/build.gradle.kts"
          if [ ! -f "$FILE" ]; then
            FILE="android/app/build.gradle"
          fi

          echo "Editing $FILE"
          sed -i 's/compileSdk = [0-9]*/compileSdk = 34/g' "$FILE" || true
          sed -i 's/targetSdk = [0-9]*/targetSdk = 34/g' "$FILE" || true
          sed -i 's/minSdk = [0-9]*/minSdk = 21/g' "$FILE" || true
          sed -i 's/compileSdk [0-9]*/compileSdk 34/g' "$FILE" || true
          sed -i 's/targetSdk [0-9]*/targetSdk 34/g' "$FILE" || true
          sed -i 's/minSdk [0-9]*/minSdk 21/g' "$FILE" || true

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

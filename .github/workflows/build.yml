name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Remove broken android folder
        run: rm -rf android

      - name: Recreate Android project
        run: flutter create --platforms=android .

      - name: Fix Android SDK versions for Plugins
        run: |
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk flutter\.targetSdkVersion/targetSdk 34/g' android/app/build.gradle || true
          sed -i 's/minSdk flutter\.minSdkVersion/minSdk 21/g' android/app/build.gradle || true
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

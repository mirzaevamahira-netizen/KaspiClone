name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Remove broken android folder
        run: rm -rf android

      - name: Recreate Android project
        run: flutter create --platforms=android .

      - name: Force SDK 36 in build.gradle.kts
        run: |
          FILE="android/app/build.gradle.kts"
          
          # Выставляем compileSdk и targetSdk на 36, а minSdk на 21
          sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' "$FILE"
          sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' "$FILE"
          sed -i 's/minSdk = [0-9]*/minSdk = 21/g' "$FILE"
          sed -i 's/compileSdk [0-9]*/compileSdk 36/g' "$FILE"
          sed -i 's/targetSdk [0-9]*/targetSdk 36/g' "$FILE"
          sed -i 's/minSdk [0-9]*/minSdk = 21/g' "$FILE"
          
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g' "$FILE"
          sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/g' "$FILE"
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 21/g' "$FILE"

          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Install Android SDK 36 Platform
        run: |
          echo "y" | android-sdk-manager --install "platforms;android-36" || true
          # Альтернативный способ через sdkmanager если первый недоступен
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
